name: Deploy to AWS

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-outpost-specs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::019141478782:role/society-github-deploy
          aws-region: us-east-1
      - name: Deploy the handbook
        env:
          IMAGE: society-specs:prod
          SERVICE: prod-specs
        run: bash .github/scripts/deploy-outpost.sh
